<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena 1v1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b16;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #menu {
            position: relative;
            z-index: 20;
            text-align: center;
            background: rgba(15, 15, 35, 0.95);
            padding: 30px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            z-index: 30;
            text-align: center;
            background: rgba(15, 15, 35, 0.95);
            padding: 30px;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        button {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            width: 100%;
            touch-action: manipulation;
        }
        button:hover {
            background: #00ffff;
            color: #0b0b16;
            box-shadow: 0 0 20px #00ffff;
        }
        .btn-danger {
            border-color: #ff0055;
            color: #ff0055;
        }
        .btn-danger:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
        }
        .btn-small {
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
            margin-top: 5px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            background: #000;
            color: #00ffff;
            border: 2px solid #ff00ff;
            text-align: center;
            width: 80%;
            margin-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            user-select: text;
            -webkit-user-select: text;
        }
        #gameCanvas {
            display: none;
            background: #050510;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            border: 2px solid #00ffff;
            max-width: 100%;
            height: auto;
        }
        #hud {
            display: none;
            width: 100%;
            max-width: 800px;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .info-box {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border: 1px dashed #ff00ff;
            margin: 15px 0;
            font-size: 14px;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }
        /* Contrôles tactiles / souris mobiles */
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 15;
            pointer-events: none;
        }
        .dpad-container {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            pointer-events: auto;
        }
        .d-btn {
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid #00ffff;
            color: #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
        }
        .d-btn:active, .d-btn.active {
            background: rgba(0, 255, 255, 0.5);
        }
        #btnFire {
            background: rgba(255, 0, 255, 0.3);
            border: 2px solid #ff00ff;
            color: #ff00ff;
            width: 90px;
            height: 90px;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            cursor: pointer;
            touch-action: none;
        }
        #btnFire:active, #btnFire.active {
            background: rgba(255, 0, 255, 0.7);
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>CYBER ARENA 1V1</h1>
        <div id="mainButtons">
            <p>Choisissez votre rôle :</p>
            <button onclick="setupHost()">Joueur 1 (Hôte)</button>
            <button onclick="setupClientMenu()">Joueur 2 (Rejoindre)</button>
        </div>

        <div id="hostSection" style="display:none;">
            <p>Votre Code de Connexion :</p>
            <div id="myIdDisplay" class="info-box">Génération...</div>
            <button class="btn-small" onclick="copyHostId()">📋 Copier le code</button>
            <p style="font-size: 12px; color: #888; margin-top: 10px;">Transmettez ce code à votre adversaire.</p>
            <button onclick="startHostGame()">Lancer la partie</button>
        </div>

        <div id="clientSection" style="display:none;">
            <p>Entrez le code du Joueur 1 :</p>
            <input type="text" id="hostIdInput" placeholder="Collez le code ici">
            <br>
            <button onclick="connectToHost()">Se connecter</button>
            <button onclick="location.reload()" style="border-color: #888; color: #888;">Retour</button>
        </div>
    </div>

    <!-- Écran de Fin de Partie -->
    <div id="gameOverScreen">
        <h1 id="winnerText">FIN DE PARTIE</h1>
        <p id="winnerSub">Un joueur a été éliminé !</p>
        <button onclick="restartGame()">Recommencer</button>
        <button class="btn-danger" onclick="quitToMenu()">Quitter</button>
    </div>

    <div id="hud">
        <div id="p1Health" style="color: #00ffff;">J1 Santé: 100</div>
        <div id="statusText">En attente...</div>
        <div id="p2Health" style="color: #ff00ff;">J2 Santé: 100</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Contrôles Virtuels (Souris et Tactile compatibles) -->
    <div id="mobileControls">
        <div class="dpad-container">
            <div></div>
            <div class="d-btn" id="ctrl-up">▲</div>
            <div></div>
            <div class="d-btn" id="ctrl-left">◀</div>
            <div></div>
            <div class="d-btn" id="ctrl-right">▶</div>
            <div></div>
            <div class="d-btn" id="ctrl-down">▼</div>
            <div></div>
        </div>
        <div id="btnFire">FEU</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        let peer, conn;
        let isHost = false;
        let gameStarted = false;
        let gameOver = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let p1 = { x: 100, y: 300, angle: 0, health: 100, color: '#00ffff' };
        let p2 = { x: 700, y: 300, angle: Math.PI, health: 100, color: '#ff00ff' };
        let bullets = [];
        let obstacles = [];
        let keys = {};
        let touchKeys = { up: false, down: false, left: false, right: false, fire: false };
        let lastSpaceState = false;

        function bindButton(id, keyName) {
            const el = document.getElementById(id);
            if (!el) return;

            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                touchKeys[keyName] = true;
                el.classList.add('active');
            });
            el.addEventListener('pointerup', (e) => {
                e.preventDefault();
                touchKeys[keyName] = false;
                el.classList.remove('active');
            });
            el.addEventListener('pointerleave', (e) => {
                touchKeys[keyName] = false;
                el.classList.remove('active');
            });
        }

        bindButton('ctrl-up', 'up');
        bindButton('ctrl-down', 'down');
        bindButton('ctrl-left', 'left');
        bindButton('ctrl-right', 'right');
        bindButton('btnFire', 'fire');

        function copyHostId() {
            const idText = document.getElementById('myIdDisplay').innerText;
            navigator.clipboard.writeText(idText).then(() => {
                alert("Code copié dans le presse-papier !");
            }).catch(err => {
                console.error('Erreur lors de la copie : ', err);
            });
        }

        function generateRandomMap() {
            obstacles = [];
            const layouts = [
                [{ x: 360, y: 220, w: 80, h: 40 }, { x: 360, y: 340, w: 80, h: 40 }, { x: 220, y: 140, w: 40, h: 80 }, { x: 540, y: 380, w: 40, h: 80 }],
                [{ x: 280, y: 180, w: 40, h: 240 }, { x: 480, y: 180, w: 40, h: 240 }, { x: 380, y: 280, w: 40, h: 40 }],
                [{ x: 200, y: 280, w: 100, h: 40 }, { x: 500, y: 280, w: 100, h: 40 }, { x: 380, y: 120, w: 40, h: 100 }, { x: 380, y: 380, w: 40, h: 100 }]
            ];
            obstacles = layouts[Math.floor(Math.random() * layouts.length)];
        }

        function setupHost() {
            isHost = true;
            document.getElementById('mainButtons').style.display = 'none';
            document.getElementById('hostSection').style.display = 'block';

            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('myIdDisplay').innerText = id;
            });

            peer.on('connection', (c) => {
                conn = c;
                initDataConnection();
                document.getElementById('statusText').innerText = "Adversaire connecté !";
            });
        }

        function setupClientMenu() {
            isHost = false;
            document.getElementById('mainButtons').style.display = 'none';
            document.getElementById('clientSection').style.display = 'block';
        }

        function connectToHost() {
            const hostId = document.getElementById('hostIdInput').value.trim();
            if (!hostId) return alert('Veuillez entrer un code valide.');

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                initDataConnection();
                document.getElementById('statusText').innerText = "Connecté à l'hôte !";
                startHostGame();
            });
        }

        function initDataConnection() {
            if (!conn) return;
            conn.on('data', (data) => {
                if (data.type === 'restart') {
                    obstacles = data.obstacles;
                    resetGameState();
                    return;
                }

                if (isHost) {
                    p2.x = data.x;
                    p2.y = data.y;
                    p2.angle = data.angle;
                    if (data.shoot) {
                        fireBullet(p2);
                    }
                } else {
                    p1.x = data.p1.x;
                    p1.y = data.p1.y;
                    p1.angle = data.p1.angle;
                    p1.health = data.p1.health;
                    p2.health = data.p2.health;
                    bullets = data.bullets || [];
                    if (data.obstacles) obstacles = data.obstacles;

                    if (data.gameOver && !gameOver) {
                        triggerGameOver(data.winner);
                    }
                }
            });
        }

        function startHostGame() {
            if (isHost) {
                generateRandomMap();
            }
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('mobileControls').style.display = 'flex';
            canvas.style.display = 'block';
            gameStarted = true;
            gameOver = false;
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let lastShoot = 0;

        function gameLoop() {
            if (!gameStarted) return;
            if (!gameOver) {
                update();
                render();
            }
            requestAnimationFrame(gameLoop);
        }

        function checkCollision(x, y, radius) {
            if (x - radius < 0 || x + radius > canvas.width || y - radius < 0 || y + radius > canvas.height) {
                return true;
            }
            for (let obs of obstacles) {
                if (x + radius > obs.x && x - radius < obs.x + obs.w &&
                    y + radius > obs.y && y - radius < obs.y + obs.h) {
                    return true;
                }
            }
            return false;
        }

        function update() {
            let speed = 4;
            let myPlayer = isHost ? p1 : p2;

            let up = keys['z'] || keys['arrowup'] || touchKeys.up;
            let down = keys['s'] || keys['arrowdown'] || touchKeys.down;
            let left = keys['q'] || keys['arrowleft'] || touchKeys.left;
            let right = keys['d'] || keys['arrowright'] || touchKeys.right;

            let nextX = myPlayer.x;
            let nextY = myPlayer.y;

            if (up) { nextY -= speed; myPlayer.angle = -Math.PI/2; }
            if (down) { nextY += speed; myPlayer.angle = Math.PI/2; }
            if (left) { nextX -= speed; myPlayer.angle = Math.PI; }
            if (right) { nextX += speed; myPlayer.angle = 0; }

            if (up && left) myPlayer.angle = -3 * Math.PI / 4;
            if (up && right) myPlayer.angle = -Math.PI / 4;
            if (down && left) myPlayer.angle = 3 * Math.PI / 4;
            if (down && right) myPlayer.angle = Math.PI / 4;

            if (!checkCollision(nextX, myPlayer.y, 15)) {
                myPlayer.x = nextX;
            }
            if (!checkCollision(myPlayer.x, nextY, 15)) {
                myPlayer.y = nextY;
            }

            let spacePressed = keys[' '] || touchKeys.fire;
            let shouldShoot = false;
            if (spacePressed && !lastSpaceState && Date.now() - lastShoot > 400) {
                shouldShoot = true;
                lastShoot = Date.now();
            }
            lastSpaceState = spacePressed;

            if (isHost) {
                if (shouldShoot) {
                    fireBullet(p1);
                }

                bullets.forEach((b, index) => {
                    b.x += b.vx;
                    b.y += b.vy;

                    let hitObs = false;
                    for (let obs of obstacles) {
                        if (b.x > obs.x && b.x < obs.x + obs.w && b.y > obs.y && b.y < obs.y + obs.h) {
                            hitObs = true;
                            break;
                        }
                    }

                    if (hitObs || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        bullets.splice(index, 1);
                    } else if (Math.hypot(b.x - p1.x, b.y - p1.y) < 15 && b.owner !== 'p1') {
                        p1.health = Math.max(0, p1.health - 10);
                        bullets.splice(index, 1);
                    } else if (Math.hypot(b.x - p2.x, b.y - p2.y) < 15 && b.owner !== 'p2') {
                        p2.health = Math.max(0, p2.health - 10);
                        bullets.splice(index, 1);
                    }
                });

                let winner = null;
                if (p1.health <= 0) winner = "JOUEUR 2";
                else if (p2.health <= 0) winner = "JOUEUR 1";

                if (winner && !gameOver) {
                    triggerGameOver(winner);
                }

                if (conn && conn.open) {
                    conn.send({
                        p1: { x: p1.x, y: p1.y, angle: p1.angle, health: p1.health },
                        p2: { health: p2.health },
                        bullets,
                        obstacles,
                        gameOver: gameOver,
                        winner: winner
                    });
                }
            } else {
                if (conn && conn.open) {
                    conn.send({
                        x: p2.x,
                        y: p2.y,
                        angle: p2.angle,
                        shoot: shouldShoot
                    });
                }
            }

            document.getElementById('p1Health').innerText = `J1 Santé: ${p1.health}`;
            document.getElementById('p2Health').innerText = `J2 Santé: ${p2.health}`;
        }

        function triggerGameOver(winnerName) {
            gameOver = true;
            document.getElementById('winnerText').innerText = `VICTOIRE DU ${winnerName} !`;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        function resetGameState() {
            p1.x = 100; p1.y = 300; p1.health = 100; p1.angle = 0;
            p2.x = 700; p2.y = 300; p2.health = 100; p2.angle = Math.PI;
            bullets = [];
            gameOver = false;
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function restartGame() {
            if (isHost) {
                generateRandomMap();
            }
            resetGameState();
            if (conn && conn.open) {
                conn.send({ type: 'restart', obstacles });
            }
        }

        function quitToMenu() {
            location.reload();
        }

        function fireBullet(player) {
            bullets.push({
                x: player.x + Math.cos(player.angle) * 20,
                y: player.y + Math.sin(player.angle) * 20,
                vx: Math.cos(player.angle) * 9,
                vy: Math.sin(player.angle) * 9,
                owner: player === p1 ? 'p1' : 'p2'
            });
        }

        function render() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#112244';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            drawPlayer(p1);
            drawPlayer(p2);

            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawPlayer(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillRect(0, -3, 20, 6);
            ctx.restore();
        }
    </script>
</body>
</html>
